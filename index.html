<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hélène Cléri — Psychologue clinicienne</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  iframe { border:0; width:100%; height:100vh; height:100dvh; display:block; }
</style>
</head>
<body>
  <iframe id="site" title="Hélène Cléri — Psychologue clinicienne"></iframe>
  <script>
    var frame = document.getElementById('site');
    var BREAKPOINT = '(max-width: 900px)';

    function targetPage() {
      return window.matchMedia(BREAKPOINT).matches ? 'mobile.html' : 'desktop.html';
    }

    function loadIfNeeded() {
      var wanted = targetPage();
      if (frame.dataset.current !== wanted) {
        frame.src = wanted;
        frame.dataset.current = wanted;
      }
    }

    loadIfNeeded();

    // Re-check on resize (e.g. rotating a tablet, resizing a browser window)
    // without reloading on every pixel change.
    var resizeTimer;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(loadIfNeeded, 200);
    });
  </script>
</body>
</html>
