<style>
  :root{ --ink:#2b2620; --paper:#fdf6e5; --sub:#8a8072; --terracotta:#c1642f; --green:#4a6a3c; }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Work Sans',sans-serif; }

  .topbar{
    position:fixed; top:0; left:0; width:100%; z-index:40; display:flex; align-items:center; justify-content:space-between;
    padding:22px 6vw; pointer-events:none;
  }
  .topbar > *{ pointer-events:auto; }
  @media (max-width:760px){
    .topbar{ position:relative; pointer-events:auto; }
    .topbar > *{ pointer-events:auto; }
  }
  .topbar > *{ pointer-events:auto; }
  .back-link{
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; letter-spacing:.04em; text-decoration:none;
    color:#2b2620; background:#fdfcf7; border:1px solid rgba(43,38,32,.18); border-radius:999px;
    padding:9px 18px; box-shadow:0 8px 16px rgba(43,38,32,.1); transition:transform .18s ease;
  }
  .back-link:hover{ transform:translateX(-3px); }
  .topbar .signature{ font-family:'Indie Flower',cursive; font-size:20px; color:#2b2620; }

  .section-kicker{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--sub); position:absolute; top:78px; left:6vw; z-index:5;
  }

  @keyframes aptBob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-6px);} }
  @keyframes aptWalk{ 0%,100%{ transform:translateY(0) rotate(-2deg);} 50%{ transform:translateY(-9px) rotate(2deg);} }

  .apt-nav{ display:flex; align-items:center; gap:10px; }
  .apt-arrow{
    width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(20,15,10,.2); background:rgba(20,15,10,.08); color:#2b2620; cursor:pointer;
    font-size:12px; transition:opacity .2s ease;
  }
  .apt-arrow[disabled]{ opacity:.3; pointer-events:none; }
  .apt-dots{ display:flex; gap:6px; }
  .apt-dot{ width:5px; height:5px; border-radius:50%; background:#2b2620; opacity:.4; transition:opacity .2s ease, transform .2s ease; }
  .apt-dot.active{ opacity:1; transform:scale(1.3); }

    display:flex; align-items:stretch;
  }

  .story-more-btn{
    margin-top:26px; display:inline-block; text-decoration:none;
    font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:.04em; color:#fdfcfa;
    background:#2b2620; border:1.5px solid #2b2620; border-radius:999px; padding:12px 24px;
    box-shadow:0 10px 20px rgba(0,0,0,.16); transition:transform .18s ease, box-shadow .18s ease;
  }
  .story-more-btn:hover{ transform:translateY(-2px); box-shadow:0 14px 26px rgba(0,0,0,.22); }

  .story-journey{
    position:relative; width:100%; max-width:1000px;
    display:flex; flex-direction:column; align-items:center;
  }
  .journey-track{
    position:relative; width:max-content; height:220px;
    margin-top:40px; padding:0 60px 0 0;
  }
  .journey-line{
    position:absolute; left:46vw; width:1500px; top:160px; height:2px;
    background:rgba(43,38,32,.25);
  }
  .journey-city{
    position:absolute; top:160px; transform:translateX(-50%);
    width:130px; text-align:center; cursor:pointer;
  }
  .journey-city .frieze-dot{
    position:absolute; top:0; left:50%; transform:translate(-50%,-50%);
    width:11px; height:11px; border-radius:50%; background:#2b2620; z-index:2; transition:transform .15s ease;
  }
  .journey-city:hover .frieze-dot{ transform:translate(-50%,-50%) scale(1.3); }
  .journey-city img{ display:none; }
  .journey-city .flabel{
    position:absolute; left:50%; transform:translateX(-50%); top:14px;
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:.03em; color:#3a352c;
    background:#fdfcfa; border:2px solid #fdfcfa; border-radius:999px; padding:5px 11px;
    box-shadow:0 5px 10px rgba(0,0,0,.18), 0 0 0 1px rgba(43,38,32,.1); white-space:nowrap;
    transition:background .35s ease, border-color .35s ease, color .35s ease;
  }
  .journey-city.at-character .flabel{
    background:#4a6a3c; border-color:#4a6a3c; color:#fdf6e5;
    box-shadow:0 6px 14px rgba(74,106,60,.35), 0 0 0 1px rgba(74,106,60,.4);
  }
  .journey-city.at-character .frieze-dot{ background:#4a6a3c; }

  .story-point-text{
    margin-top:26px; max-width:340px; min-height:60px;
    background:#fdfcf7; box-shadow:0 12px 26px rgba(0,0,0,.14);
    padding:20px 24px;
    font-family:'Work Sans',sans-serif; font-size:15px; line-height:1.7; color:#3a352c; text-align:center;
    opacity:0; transform:translateY(8px); transition:opacity .4s ease, transform .4s ease;
  }
  .story-point-text.visible{ opacity:1; transform:translateY(0); }

  .journey-character{
    position:absolute; top:160px; left:0; width:96px; z-index:5;
    transition:left .6s cubic-bezier(.3,.7,.3,1);
    transform:translate(-50%, calc(-100% - 12px));
  }
  .journey-character img{ width:100%; display:block; filter:drop-shadow(0 12px 12px rgba(0,0,0,.25)); animation:aptBob 2.6s ease-in-out infinite; }
  .journey-character.walking img{ animation:aptWalk .28s ease-in-out infinite; }

  .story-point-label{
    font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:.05em; text-transform:uppercase;
    color:var(--terracotta); margin-top:18px; opacity:0; transition:opacity .4s ease;
  }
  .story-point-label.visible{ opacity:1; }

  @media (max-width:900px){
    .story-section{ flex-direction:column; }
    .story-left{ flex:none; padding:max(10vh, 100px) 6vw 3vh; background-image:none; }
    .story-right{
      padding:2vh 0 6vh; overflow-x:auto; -webkit-overflow-scrolling:touch;
      background-image:none;
      display:flex; align-items:center;
    }
    .story-journey{ padding:0 6vw; }
  }
  /* ---------- topbar cassette: set the mood ---------- */
  .topbar-right-group{ display:flex; align-items:center; gap:16px; }
  .topbar-cassette{ width:72px; cursor:pointer; transition:transform .15s ease; position:relative; }
  .topbar-cassette img{ width:100%; display:block; filter:drop-shadow(0 6px 10px rgba(0,0,0,.22)); }
  .topbar-cassette:hover{ transform:scale(1.08) rotate(-4deg); }
  .topbar-cassette-tip{
    position:absolute; right:0; top:100%; margin-top:8px; white-space:nowrap; z-index:2;
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.04em;
    color:#fdfcf7; background:#2b2620; border-radius:999px; padding:5px 12px;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .topbar-cassette:hover .topbar-cassette-tip{ opacity:1; }
  .topbar-cassette-player{
    position:fixed; top:100px; right:5vw; z-index:59; width:300px; max-width:80vw;
    background:#fdfcf7; border-radius:14px; box-shadow:0 20px 44px rgba(20,15,10,.3);
    padding:10px; opacity:0; visibility:hidden; transform:translateY(-8px);
    transition:opacity .25s ease, transform .25s ease, visibility .25s ease;
  }
  .topbar-cassette-player.open{ opacity:1; visibility:visible; transform:translateY(0); }
  .topbar-cassette-player iframe{ border-radius:10px; display:block; width:100%; }
  @media (max-width:480px){
    .topbar-cassette-player{ right:4vw; width:calc(100vw - 8vw); max-width:none; }
  }
</style>

<script>
  (function(){
    const track = document.getElementById('journeyTrack');
    const character = document.getElementById('journeyCharacter');
    const cities = Array.from(track.querySelectorAll('.journey-city'));
    const prevBtn = document.getElementById('journeyPrev');
    const nextBtn = document.getElementById('journeyNext');
    const dotsWrap = document.getElementById('journeyDots');
    const pointText = document.getElementById('storyPointText');
    const pointLabel = document.getElementById('storyPointLabel');
    let current = -1;

    const pointTexts = [
      "Tout commence ici, un 5 août 1991 — mon enfance et mon adolescence au sein de la ville blanche.",
      "2009 — j'arrive à 18 ans, mon bac en poche, je rejoins la ville rose et commence un DUT en gestion des entreprises et des administrations.",
      "2011 — je redécouvre la vie étudiante à Skema Business School, en intégrant des associations, et j'explore une des plus belles régions de France.",
      "2013 — l'aventure américaine : je passe 8 mois aux États-Unis, en Caroline du Nord, à l'université.",
      "2014 — première année dans la capitale : une année de césure, mes premiers stages.",
      "2015 — je décroche mon master en école de commerce, spécialité achats.",
      "2016 — je commence des missions chez Renault en tant qu'acheteuse, et je travaille sur plusieurs projets transverses en tant que proxy product owner.",
      "2020 — je commence une formation d'UX/UI designer, les soirs et les week-ends, chez Ironhack.",
      "2021 — je prends un nouveau poste chez Pacte PME, où je crée une plateforme pour mettre en lien les PME et les grandes entreprises.",
      "2024 — je commence mes études de psychologie.",
      "2025 — je commence mon activité d'illustratrice et de créatrice de sites web illustrés et de concepts communautaires."
    ];

    cities.forEach((_, i)=>{
      const dot = document.createElement('div');
      dot.className = 'apt-dot' + (i===0 ? ' active' : '');
      dotsWrap.appendChild(dot);
    });
    const dots = Array.from(dotsWrap.children);

    function goTo(idx, opts){
      opts = opts || {};
      const target = Math.max(0, Math.min(cities.length - 1, idx));
      if(target === current) return;
      current = target;

      character.style.left = cities[current].offsetLeft + 'px';

      character.classList.add('walking');
      dots.forEach((d,i)=> d.classList.toggle('active', i===current));
      cities.forEach((c,i)=> c.classList.toggle('at-character', i===current));
      prevBtn.toggleAttribute('disabled', current===0);
      nextBtn.toggleAttribute('disabled', current===cities.length-1);
      setTimeout(()=> character.classList.remove('walking'), 800);

      pointText.classList.remove('visible');
      pointLabel.classList.remove('visible');
      setTimeout(()=>{
        pointText.textContent = pointTexts[current] || '';
        pointText.classList.add('visible');
        const labelHtml = cities[current].querySelector('.flabel');
        pointLabel.innerHTML = labelHtml ? labelHtml.innerHTML : '';
        pointLabel.classList.add('visible');
      }, 200);

      if(opts.scrollTo !== false){
        const storyRight = track.closest('.story-right');
        if(storyRight){
          isSyncScrolling = true;
          const cityEl = cities[current];
          const targetScroll = cityEl.offsetLeft + track.offsetLeft - (storyRight.clientWidth/2);
          storyRight.scrollTo({ left: targetScroll, behavior:'smooth' });
          setTimeout(()=>{ isSyncScrolling = false; }, 500);
        }
      }
    }

    let isSyncScrolling = false;
    prevBtn.addEventListener('click', ()=> goTo(current-1));
    nextBtn.addEventListener('click', ()=> goTo(current+1));
    window.addEventListener('resize', ()=>{ const c = current; current = -1; goTo(c, {scrollTo:false}); });
    cities.forEach((city, i)=> city.addEventListener('click', ()=> goTo(i)));

    // travel with scroll: as the user scrolls the frieze, the character and text follow along
    const storyRightEl = track.closest('.story-right');
    if(storyRightEl){
      let scrollDebounce;
      storyRightEl.addEventListener('scroll', ()=>{
        if(isSyncScrolling) return;
        clearTimeout(scrollDebounce);
        scrollDebounce = setTimeout(()=>{
          const containerCenter = storyRightEl.scrollLeft + storyRightEl.clientWidth/2;
          let closest = 0, closestDist = Infinity;
          cities.forEach((city, i)=>{
            const cityCenter = city.offsetLeft + track.offsetLeft;
            const dist = Math.abs(cityCenter - containerCenter);
            if(dist < closestDist){ closestDist = dist; closest = i; }
          });
          if(closest !== current) goTo(closest, {scrollTo:false});
        }, 80);
      });
    }

    goTo(0, {scrollTo:false});
    // center the first stop instantly on load, no animation
    requestAnimationFrame(()=>{
      const storyRightEl = track.closest('.story-right');
      if(storyRightEl){
        const cityEl = cities[0];
        const targetScroll = cityEl.offsetLeft + track.offsetLeft - (storyRightEl.clientWidth/2);
        storyRightEl.scrollLeft = Math.max(0, targetScroll);
      }
    });
  })();

  (function(){
    const btn = document.getElementById('topCassette');
    const player = document.getElementById('topCassettePlayer');
    const iframe = document.getElementById('topCassetteIframe');
    const embedSrc = 'https://open.spotify.com/embed/album/0l8zYqoUeBYg47Gmevq9HZ?utm_source=generator';
    let loaded = false, open = false;
    btn.addEventListener('click', ()=>{
      open = !open;
      if(open){ if(!loaded){ iframe.src = embedSrc; loaded = true; } player.classList.add('open'); }
      else { player.classList.remove('open'); }
    });
    document.addEventListener('click', (e)=>{
      if(open && !player.contains(e.target) && !btn.contains(e.target)){ open = false; player.classList.remove('open'); }
    });
  })();
</script>
</body>
</html>
